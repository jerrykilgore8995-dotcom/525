name: Vintage 525C detector transformer comparison
on:
  workflow_dispatch:
  push:
    paths:
      - 'spice/compare_detector.py'
      - '.github/workflows/vintage-detector.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    strategy:
      fail-fast: false
      matrix:
        amp: [2520, 990]
        detector: [legacy, ap2623]
    steps:
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git ngspice=44.2+ds-1 python3 python3-numpy
      - uses: actions/checkout@v4
      - name: Measure steady transfer and attack for this winding ratio
        env:
          AMP: ${{ matrix.amp }}
          DETECTOR: ${{ matrix.detector }}
          OPENBLAS_NUM_THREADS: '1'
        run: python3 spice/compare_detector.py --pair "$AMP/2520" --detector-transformer "$DETECTOR" --output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vintage-detector-${{ matrix.amp }}-${{ matrix.detector }}
          path: evidence/
          if-no-files-found: error
