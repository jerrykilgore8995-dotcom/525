name: Vintage 525C targeted Mod crest checks
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vintage-crest-retry.yml'
permissions:
  contents: read
jobs:
  retry:
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    strategy:
      fail-fast: false
      matrix:
        resistance: [20, 30]
        step: ['2.5e-7', '1.25e-7']
    steps:
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git ngspice=44.2+ds-1 python3 python3-numpy
      - uses: actions/checkout@v4
      - name: Measure the high-drive JE-990 crest at the specified timestep
        env:
          R44: ${{ matrix.resistance }}
          STEP: ${{ matrix.step }}
          OPENBLAS_NUM_THREADS: '1'
        run: python3 spice/nominal_timing.py attack --pair 990/2520 --input-position .5 --comp-r44 "$R44" --attack-phase 90 --attack-drive 4 --attack-step "$STEP" --timeout 480 --workers 1 --output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 525C-crest-${{ matrix.resistance }}-${{ matrix.step }}
          path: evidence/
          if-no-files-found: error
