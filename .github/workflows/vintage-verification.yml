name: Vintage 525C response and timing
on:
  workflow_dispatch:
  push:
    paths:
      - 'spice/**'
      - '.github/workflows/vintage-verification.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    strategy:
      fail-fast: false
      matrix:
        check: [ac, attack, release, magnetics]
    steps:
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git ngspice=44.2+ds-1 python3 python3-numpy
      - uses: actions/checkout@v4
      - name: Measure connected vintage fixture
        env:
          CHECK: ${{ matrix.check }}
          OPENBLAS_NUM_THREADS: '1'
        run: python3 spice/verify.py "$CHECK" --output verification --timeout 150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vintage-525C-${{ matrix.check }}
          path: verification/
          if-no-files-found: error
