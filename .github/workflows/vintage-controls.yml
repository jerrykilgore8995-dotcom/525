name: Vintage 525C control calibration
on:
  workflow_dispatch:
  push:
    paths:
      - 'spice/control_grid.py'
      - 'spice/check_control_law.py'
      - 'dsp/**'
      - '.github/workflows/vintage-controls.yml'
permissions:
  contents: read
jobs:
  small-signal:
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    strategy:
      fail-fast: false
      matrix:
        amp: [2520, 990]
        mode: [C, L, 'OFF']
    steps:
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git ngspice=44.2+ds-1 python3 python3-numpy g++
      - uses: actions/checkout@v4
      - name: Measure the pot axes, ceiling ladder and simultaneous-control holdouts
        env:
          AMP: ${{ matrix.amp }}
          MODE: ${{ matrix.mode }}
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python3 spice/control_grid.py ac --pair "$AMP/2520" --mode "$MODE" --output evidence
          g++ -O2 -std=c++17 -Wall -Wextra -Werror dsp/measure_output_ceiling.cpp -o measure-tap
          python3 spice/check_control_law.py evidence/summary.csv evidence/control-law.csv --dsp measure-tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vintage-ac-${{ matrix.amp }}-${{ matrix.mode }}
          path: evidence/
          if-no-files-found: error
  nonlinear:
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    strategy:
      fail-fast: false
      matrix:
        amp: [2520, 990]
        mode: [C, L]
        shard:
          - { id: 1, marks: '0 2 4 6' }
          - { id: 2, marks: '8 10 12 14' }
          - { id: 3, marks: '16 18 20' }
    steps:
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git ngspice=44.2+ds-1 python3 python3-numpy
      - uses: actions/checkout@v4
      - name: Measure control and drive interactions through clipping
        env:
          AMP: ${{ matrix.amp }}
          MODE: ${{ matrix.mode }}
          MARKS: ${{ matrix.shard.marks }}
          OPENBLAS_NUM_THREADS: '1'
        run: python3 spice/control_grid.py tone --pair "$AMP/2520" --mode "$MODE" --ceilings $MARKS --output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vintage-tone-${{ matrix.amp }}-${{ matrix.mode }}-${{ matrix.shard.id }}
          path: evidence/
          if-no-files-found: error
