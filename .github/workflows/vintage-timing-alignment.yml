name: Vintage 525C audio timing alignment
on:
  workflow_dispatch:
  push:
    paths:
      - 'spice/nominal_timing.py'
      - '.github/workflows/vintage-timing-alignment.yml'
permissions:
  contents: read
jobs:
  audio-timing:
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    strategy:
      fail-fast: false
      matrix:
        amp: [2520, 990]
        mode: [C, L]
        metric: [attack, release]
    steps:
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git ngspice=44.2+ds-1 python3 python3-numpy
      - uses: actions/checkout@v4
      - name: Measure gain-stage timing with the AP2623 detector ratio
        env:
          AMP: ${{ matrix.amp }}
          MODE: ${{ matrix.mode }}
          METRIC: ${{ matrix.metric }}
          OPENBLAS_NUM_THREADS: '1'
        run: python3 spice/nominal_timing.py "$METRIC" --pair "$AMP/2520" --mode "$MODE" --output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 525C-audio-${{ matrix.metric }}-${{ matrix.amp }}-${{ matrix.mode }}
          path: evidence/
          if-no-files-found: error
