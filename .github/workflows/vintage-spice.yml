name: Vintage 525C circuit checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'spice/**'
      - 'reference/**'
      - '.github/workflows/vintage-spice.yml'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    steps:
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git ngspice=44.2+ds-1 python3
      - uses: actions/checkout@v4
      - name: Circuit coverage and diagnostics
        working-directory: spice
        run: |
          mkdir ../evidence
          python3 audit.py > ../evidence/component-mapping.txt
          ngspice --version > ../evidence/ngspice-version.txt
          for opamp in 2520 2520-q9 2520-drawing 990; do
            for mode in C L OFF; do
              for index in 0 5 10; do
                name="$opamp-$mode-$index"
                python3 fixture.py --opamp "$opamp" --mode "$mode" --ceiling "$index" --ac > "../evidence/$name.cir"
                ngspice -b "../evidence/$name.cir" > "../evidence/$name.log" 2>&1
                grep -Eq 'of Data Rows : [1-9][0-9]+' "../evidence/$name.log"
                test "$(grep -Fc '[resistance] = 2.000000e-02' "../evidence/$name.log")" -eq 2
              done
            done
          done
          python3 fixture.py --opamp 990 --ceiling 0 --transient --diagnostic-tolerances --trace ../evidence/990-audio.dat > ../evidence/990-audio.cir
          timeout 45 ngspice -b ../evidence/990-audio.cir > ../evidence/990-audio.log 2>&1
          grep -q '^out_rms' ../evidence/990-audio.log
          test -s ../evidence/990-audio.dat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vintage-525C-SPICE-diagnostics
          path: |
            evidence/
            spice/*.lib
            reference/SPICE.md
  characterization:
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    strategy:
      fail-fast: false
      matrix:
        pairing:
          - { amplifiers: '2520/2520', artifact: '2520' }
          - { amplifiers: '990/990', artifact: '990' }
          - { amplifiers: '990/2520', artifact: '990-2520' }
    steps:
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git ngspice=44.2+ds-1 python3
      - uses: actions/checkout@v4
      - name: Run sine and convergence cases
        working-directory: spice
        env:
          AMPLIFIERS: ${{ matrix.pairing.amplifiers }}
        run: |
          python3 characterize.py --output ../measurements --pair "$AMPLIFIERS" --timeout 25 --keep-all
          test "$(wc -l < ../measurements/metrics.csv)" -eq 35
          grep -q ',complete,' ../measurements/metrics.csv
      - name: Capture detector and gain recovery
        if: matrix.pairing.artifact == '2520'
        working-directory: spice
        run: |
          python3 fixture.py --input .9 --ceiling 8 --mode C --dbu -30 --burst-dbu 4 --seconds .3 --transient --max-step 2e-6 --trace ../measurements/burst.dat > ../measurements/burst.cir
          timeout 45 ngspice -b ../measurements/burst.cir > ../measurements/burst.log 2>&1
          test -s ../measurements/burst.dat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vintage-525C-measurements-${{ matrix.pairing.artifact }}
          path: |
            measurements/
            spice/*.lib
            reference/SPICE.md
