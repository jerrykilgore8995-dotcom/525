name: Vintage 525C gain law and alignment
on:
  workflow_dispatch:
  push:
    paths:
      - 'spice/gain_law.py'
      - '.github/workflows/vintage-gain-law.yml'
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    strategy:
      fail-fast: false
      matrix:
        amp: [2520, 990]
        mode: [C, L]
        shard: [0, 1]
        subset: [controls, trim]
        exclude:
          - mode: C
            subset: trim
    steps:
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git ngspice=44.2+ds-1 python3 python3-numpy
      - uses: actions/checkout@v4
      - name: Measure local slope and fit stable gain-law spans
        env:
          AMP: ${{ matrix.amp }}
          MODE: ${{ matrix.mode }}
          SHARD: ${{ matrix.shard }}
          SUBSET: ${{ matrix.subset }}
          OPENBLAS_NUM_THREADS: '1'
        run: python3 spice/gain_law.py --pair "$AMP/2520" --mode "$MODE" --shard "$SHARD" --subset "$SUBSET" --output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 525C-gain-law-${{ matrix.amp }}-${{ matrix.mode }}-${{ matrix.subset }}-${{ matrix.shard }}
          path: evidence/
          if-no-files-found: error
