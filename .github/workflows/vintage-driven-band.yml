name: Vintage 525C driven frequency and phase
on:
  workflow_dispatch:
  push:
    paths:
      - 'spice/driven_band.py'
      - '.github/workflows/vintage-driven-band.yml'
permissions:
  contents: read
jobs:
  driven-band:
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    strategy:
      fail-fast: false
      matrix:
        amp: [2520, 990]
        mode: [C, L]
        load: [600, 10000]
    steps:
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git ngspice=44.2+ds-1 python3 python3-numpy
      - uses: actions/checkout@v4
      - name: Measure magnitude, phase, and harmonic spectra
        env:
          AMP: ${{ matrix.amp }}
          MODE: ${{ matrix.mode }}
          LOAD: ${{ matrix.load }}
          OPENBLAS_NUM_THREADS: '1'
        run: python3 spice/driven_band.py --pair "$AMP/2520" --mode "$MODE" --load "$LOAD" --output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 525C-driven-band-${{ matrix.amp }}-${{ matrix.mode }}-${{ matrix.load }}
          path: evidence/
          if-no-files-found: error
