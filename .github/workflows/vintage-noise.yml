name: Vintage 525C noise floor
on:
  workflow_dispatch:
  push:
    paths:
      - 'spice/noise_floor.py'
      - '.github/workflows/vintage-noise.yml'
permissions:
  contents: read
jobs:
  noise:
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    strategy:
      fail-fast: false
      matrix:
        amplifier: [2520, 990]
        load: [600, 10000]
    steps:
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git ngspice=44.2+ds-1 python3 python3-numpy
      - uses: actions/checkout@v4
      - name: Measure output and input-referred noise
        env:
          AMP: ${{ matrix.amplifier }}
          LOAD: ${{ matrix.load }}
          OPENBLAS_NUM_THREADS: '1'
        run: python3 spice/noise_floor.py --pair "$AMP/2520" --load "$LOAD" --output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 525C-noise-${{ matrix.amplifier }}-${{ matrix.load }}
          path: evidence/
          if-no-files-found: error
