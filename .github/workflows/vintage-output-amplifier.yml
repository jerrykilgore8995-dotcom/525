name: Vintage 525C native output amplifier
on:
  workflow_dispatch:
  push:
    paths:
      - 'dsp/OutputAmplifier.h'
      - 'dsp/measure_output_amplifier.cpp'
      - 'spice/check_output_amplifier.py'
      - '.github/workflows/vintage-output-amplifier.yml'
permissions:
  contents: read
jobs:
  a2:
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    steps:
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git g++ ngspice=44.2+ds-1 python3 python3-numpy
      - uses: actions/checkout@v4
      - name: Measure linear A2 parity using the compiled C++ stage
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror dsp/measure_output_amplifier.cpp -o measure-a2
          python3 spice/check_output_amplifier.py --dsp measure-a2 --output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 525C-native-A2-parity
          path: evidence/
          if-no-files-found: error
